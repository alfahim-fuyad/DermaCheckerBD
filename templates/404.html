{% extends "base.html" %}
{% load static %}

{% block title %}404 — Page Not Found · DermaCheckerBD{% endblock %}

{% block content %}
<section class="section">
  <div class="container-xl text-center" style="max-width: 42rem; padding-top: 4rem;">
    <div class="empty-state">
      <div class="empty-icon" style="font-size: 4rem; color: var(--muted);">
        <i data-lucide="file-question"></i>
      </div>
      <h1 class="display-4 mb-3" data-i18n="error.404_title">404</h1>
      <p class="lead text-muted mb-4" data-i18n="error.404_message">
        The page you are looking for does not exist or has been moved.
      </p>
      <div class="d-flex gap-2 justify-content-center">
        <a href="{% url 'core:home' %}" class="btn app-btn-primary">
          <i data-lucide="home" style="width:16px;height:16px;"></i>
          <span data-i18n="error.go_home">Go to homepage</span>
        </a>
        <a href="{% url 'predictor:upload' %}" class="btn app-btn-outline">
          <i data-lucide="scan-search" style="width:16px;height:16px;"></i>
          <span data-i18n="error.start_scan">Start a scan</span>
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
